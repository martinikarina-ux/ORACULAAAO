<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oráculo Digital — Descubra seu Signo e Arcano</title>

<!-- Bootstrap (via CDN), como pedido na atividade -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fontes usadas no tema techno-spiritual -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- Nossa folha de estilo própria, carregada DEPOIS do Bootstrap
     pra poder sobrescrever cores/componentes -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Camadas de fundo (estrelas + grade), fixas atrás de tudo -->
<div class="stars"></div>
<div class="grid-overlay"></div>

<!-- Container e grid de centralização vêm do Bootstrap -->
<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="col-12 col-sm-9 col-md-6 col-lg-5">

    <div class="oracle-card">
      <div class="text-center mb-4">
        <div class="oracle-symbol">✦</div>
        <h1 class="oracle-title">ORÁCULO<span>.digital</span></h1>
        <p class="oracle-subtitle text-uppercase">signo zodiacal &amp; arcano pessoal</p>
      </div>

      <!-- Formulário: usa os componentes do Bootstrap (form-label, form-control, btn)
           com nossas classes extras (label-tech, input-tech, btn-oracle) por cima -->
      <form id="form" class="mt-4" novalidate>
        <div class="mb-3">
          <label for="nome" class="form-label label-tech text-uppercase">Nome</label>
          <input type="text" class="form-control input-tech" id="nome" name="nome"
                 placeholder="Como podemos te chamar?" required>
        </div>

        <div class="mb-4">
          <label for="nascimento" class="form-label label-tech text-uppercase">Data de nascimento</label>
          <input type="date" class="form-control input-tech" id="nascimento" name="nascimento" required>
        </div>

        <button type="submit" class="btn btn-oracle w-100 py-2">REVELAR</button>
      </form>

      <p class="text-center footnote mt-4">seus dados ficam guardados só neste navegador</p>
    </div>

  </div>
</div>

<!-- Bootstrap JS (não usamos nenhum componente interativo dele aqui,
     mas fica disponível caso queira usar modais, tooltips etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Nossos scripts: dados.js precisa vir ANTES de index.js -->
<script src="js/dados.js"></script>
<script src="js/index.js"></script>
</body>
</html>
